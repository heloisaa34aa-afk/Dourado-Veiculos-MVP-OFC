<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dourado Vendas</title>
    <link rel="stylesheet" href="sidepanel.css" />
  </head>
  <body>
    <header class="topbar">
      <div class="brand-mark">D</div>
      <div><strong>Dourado Vendas</strong><span>Assistente do vendedor</span></div>
      <button id="refreshButton" class="icon-button" type="button" title="Atualizar estoque" aria-label="Atualizar estoque">↻</button>
    </header>

    <main>
      <section id="chatContext" class="context-card">
        <span class="status-dot"></span>
        <div><small>Conversa atual</small><strong id="customerName">Abra uma conversa</strong></div>
      </section>

      <section class="search-section">
        <label for="searchInput">Buscar no estoque</label>
        <input id="searchInput" type="search" placeholder="Ex.: Hilux, SUV, automático..." autocomplete="off" />
        <div id="inventoryStatus" class="inventory-status">Carregando estoque...</div>
      </section>

      <section id="vehicleList" class="vehicle-list" aria-live="polite"></section>

      <section id="composerPanel" class="composer-panel" hidden>
        <div class="composer-title">
          <div><small>Veículo selecionado</small><strong id="selectedVehicleTitle"></strong></div>
          <button id="closeComposer" type="button" aria-label="Fechar">×</button>
        </div>

        <label for="templateSelect">Objetivo da mensagem</label>
        <select id="templateSelect">
          <option value="details">Enviar detalhes</option>
          <option value="availability">Confirmar disponibilidade</option>
          <option value="financing">Simular financiamento</option>
          <option value="tradein">Receber veículo na troca</option>
        </select>

        <div id="mediaSection" class="media-section" hidden>
          <div class="sequence-heading"><label>Fotos e vídeos</label><span>Não inclui o 360°</span></div>
          <div id="mediaList" class="media-list"></div>
          <p class="media-help">Copie uma foto, clique na conversa e pressione Ctrl+V para anexá-la.</p>
        </div>

        <div class="sequence-heading"><label>Sequência para revisar</label><span id="sequenceProgress"></span></div>
        <div id="messageSequence" class="message-sequence"></div>

        <div class="actions">
          <button id="copyButton" class="secondary" type="button">Copiar atual</button>
          <button id="insertButton" class="primary" type="button">Inserir próxima</button>
        </div>
        <p class="notice">Cada item entra separadamente como rascunho. Envie no WhatsApp e depois insira o próximo.</p>
      </section>
    </main>

    <div id="toast" class="toast" role="status" aria-live="polite"></div>
    <script type="module" src="sidepanel.js"></script>
  </body>
</html>
